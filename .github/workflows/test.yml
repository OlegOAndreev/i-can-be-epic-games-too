name: Test

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

# Cancel superseded test runs for the same branch or pull request
concurrency:
  group: 'test-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
